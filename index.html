<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAILY FLOW</title>
  <script src="./index.js"></script>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div class="head">
    <h1 class="title">DAILY FLOW</h1>
  </div> 
  <div class="main">
    <div class="wrap">
      <button class="button" onclick="routinbox('morning')">
        <h1 class="buttonh1">오전일과</h1>
        <h2 class="buttonh2">하루를 활기차게 시작하는 아침 루틴</h2>
      </button>
      <button class="button" onclick="routinbox('afternoon')">
        <h1 class="buttonh1">오후일과</h1>
        <h2 class="buttonh2">집중하고 생산성을 높이는 낮 시간 루틴</h2>
      </button>
      <button class="button" onclick="routinbox('evning')">
        <h1 class="buttonh1">저녁일과</h1>
        <h2 class="buttonh2">편안한 하루 마무리를 위한 저녁루틴</h2>
      </button>
    </div>
    <div class="watch">
      <img src="/resources/images/watch.png" alt="">
      <div class="watch-text">
        <p class="week">MON</p>
        <p class="month">SEP / 21</p>
        <h1 class="time">00:00</h1>
      </div>
    </div>
    <div class="popup" id="morning">
      <p>
        <h1 class="memotitle">오전일과</h1>
        <ul class="memoname">
          <li>기상</li>
          <li>세수하고 양치하기</li>
          <li>학원갈 준비하기</li>
          <li>즐거운 마음으로 학원가기</li>
          <li>열심히 수업받기</li>
        </ul>
      </p>
      <button class="memobutton" onclick="closeroutinbox('morning')">닫기</button>
    </div>
    <div class="popup" id="afternoon">
      <p>
        <h1 class="memotitle">오후일과</h1>
        <ul class="memoname">
          <li>점심먹기</li>
          <li>오후 수업듣기</li>
        </ul>
      </p>
      <button class="memobutton" onclick="closeroutinbox('afternoon')">닫기</button>
    </div>
    <div class="popup" id="evning">
      <p>
        <h1 class="memotitle">저녁일과</h1>
        <ul class="memoname">
          <li>운동하기</li>
          <li>샤워하기</li>
          <li>기절하기</li>
        </ul>
      </p>
      <button class="memobutton" onclick="closeroutinbox('evning')">닫기</button>
    </div>
  </div> 
  <div>
    <button class="write" onclick="routinbox('writepopup')">일정정하기</button>
  </div>
  <div class="popup" id="writepopup">
      <label>
        할일
        <br>
      <input type="text" id="todo" name="hobby" value="todolist">
      </label>
      <button class="memobutton" onclick="closeroutinbox('writepopup')">닫기</button>
    </div>
</body>
</html>
